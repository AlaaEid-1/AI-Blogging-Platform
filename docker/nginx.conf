user www-data;
worker_processes auto;
error_log stderr warn;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include      mime.types;
    default_type application/octet-stream;

    # ── Logging ───────────────────────────────────────────────
    log_format main_timed
        '$remote_addr - $remote_user [$time_local] "$request" '
        '$status $body_bytes_sent "$http_referer" '
        '"$http_user_agent" "$http_x_forwarded_for" '
        '$request_time $upstream_response_time $pipe $upstream_cache_status';

    access_log /dev/stdout main_timed;
    error_log  /dev/stderr notice;

    # ── Performance ───────────────────────────────────────────
    sendfile    on;
    tcp_nopush  on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # ── Gzip compression ──────────────────────────────────────
    gzip              on;
    gzip_comp_level   5;
    gzip_min_length   256;
    gzip_proxied      any;
    gzip_vary         on;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff
        font/woff2;

    server {
        listen __PORT__ default_server;
        server_name _;

        root  /var/www/html/public;
        index index.php index.html;

        charset utf-8;

        # ── Vite hashed assets — served directly, long-lived cache ──
        # Matches /build/assets/app-abc123.css, /build/assets/app-def456.js, etc.
        location ^~ /build/ {
            # Files are content-addressed (hash in filename), so they
            # can be cached for a very long time.
            add_header Cache-Control "public, max-age=31536000, immutable";
            try_files $uri =404;
        }

        # ── Other public static files (favicons, images, robots.txt) ─
        location ~* \.(?:css|js|map|woff2?|ttf|eot|otf|ico|png|jpg|jpeg|gif|svg|webp|avif)$ {
            add_header Cache-Control "public, max-age=86400";
            try_files $uri =404;
        }

        # ── Laravel application ───────────────────────────────
        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        # ── PHP-FPM ───────────────────────────────────────────
        location ~ \.php$ {
            fastcgi_pass              127.0.0.1:9000;
            fastcgi_param             SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
            include                   fastcgi_params;
            fastcgi_hide_header       X-Powered-By;
            fastcgi_read_timeout      120;
            fastcgi_buffer_size       16k;
            fastcgi_buffers           4 16k;
        }

        # ── Block hidden files (.git, .env, etc.) ─────────────
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
